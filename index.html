<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
>

<meta name="theme-color" content="#101214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Ventura County CAD</title>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
/>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    /* prevents the pull-to-refresh / rubber-band bounce that would
       otherwise fight with a fixed, app-like mobile layout */
    overscroll-behavior: none;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #101214;
    color: white;

}


button,
input,
select {

    /* iOS Safari auto-zooms the page when a focused form field has a
       font-size under 16px - this keeps every field at 16px so typing
       in the search box or opening a dropdown doesn't yank the zoom */
    font-size: 16px;

    touch-action: manipulation;

}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.app {

    display: flex;

    width: 100%;
    height: 100%;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

    width: 390px;

    min-width: 390px;

    height: 100%;

    background: #17191c;

    border-right:
        1px solid #303338;

    display: flex;

    flex-direction: column;

    z-index: 1000;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    height: 68px;

    padding:
        0 18px;

    padding-top:
        env(safe-area-inset-top);

    height:
        calc(68px + env(safe-area-inset-top));

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        1px solid #303338;

}


.logo {

    display: flex;

    align-items: center;

    gap: 11px;

}


.logo-icon {

    width: 38px;
    height: 38px;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #292d32;

    font-size: 19px;

}


.logo-title {

    font-size: 15px;

    font-weight: 700;

}


.logo-sub {

    color: #858b93;

    font-size: 10px;

    margin-top: 2px;

}


.live {

    display: flex;

    align-items: center;

    gap: 6px;

    font-size: 10px;

    color: #8f969e;

}


.live-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #36c275;

    box-shadow:
        0 0 8px #36c275;

}


/* =========================================================
   FILTERS
   ========================================================= */

.filters {

    padding: 12px;

    border-bottom:
        1px solid #303338;

}


.search {

    width: 100%;

    padding:
        10px 12px;

    border:
        1px solid #35393f;

    background:
        #101214;

    color: white;

    border-radius: 7px;

    outline: none;

    margin-bottom: 8px;

}


.filter-row {

    display: flex;

    gap: 7px;

}


select {

    flex: 1;

    padding: 9px;

    border:
        1px solid #35393f;

    background: #24272b;

    color: white;

    border-radius: 7px;

    outline: none;

}


/* =========================================================
   STATISTICS
   ========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    padding: 10px 12px;

}


.stat {

    background: #222529;

    border:
        1px solid #303338;

    border-radius: 8px;

    padding: 9px;

}


.stat-number {

    font-size: 18px;

    font-weight: 700;

}


.stat-label {

    font-size: 9px;

    color: #858b93;

    margin-top: 2px;

}


/* =========================================================
   LEGEND
   ========================================================= */

.legend {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    padding: 0 12px 10px;

    font-size: 9px;

    color: #9aa0a7;

}


.legend-item {

    display: flex;

    align-items: center;

    gap: 4px;

}


.legend-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    flex-shrink: 0;

}


/* =========================================================
   INCIDENT LIST
   ========================================================= */

.list {

    flex: 1;

    overflow-y: auto;

}


.incident {

    padding:
        12px 14px;

    border-bottom:
        1px solid #282b2f;

    cursor: pointer;

    transition:
        background .15s;

}


.incident:hover {

    background: #222529;

}


.incident.active {

    background: #282c31;

    border-left:
        3px solid #fff;

    padding-left: 11px;

}


.incident-top {

    display: flex;

    justify-content: space-between;

    gap: 8px;

    align-items: center;

}


.badge {

    font-size: 9px;

    padding:
        3px 6px;

    border-radius: 4px;

    font-weight: 700;

}


.badge-vcfd {

    background: #491d1d;

    color: #ff7777;

}


.badge-chp {

    background: #182c49;

    color: #65a9ff;

}


.incident-type {

    font-size: 13px;

    font-weight: 700;

    margin-top: 6px;

    display: flex;

    align-items: center;

    gap: 6px;

}


.type-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    flex-shrink: 0;

}


.incident-location {

    color: #a4aab1;

    font-size: 11px;

    margin-top: 5px;

}


.incident-meta {

    display: flex;

    justify-content: space-between;

    color: #707780;

    font-size: 9px;

    margin-top: 8px;

}


/* =========================================================
   FEED STATUS
   ========================================================= */

.footer {

    padding:
        10px 13px;

    padding-bottom:
        calc(10px + env(safe-area-inset-bottom));

    border-top:
        1px solid #303338;

    background: #141619;

    font-size: 9px;

    color: #747b83;

}


.feed {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 4px;

}


.feed-left {

    display: flex;

    align-items: center;

    gap: 5px;

}


.feed-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

}


.feed-ok {

    background: #36c275;

}


.feed-bad {

    background: #e34b4b;

}


/* =========================================================
   MAP
   ========================================================= */

.map {

    flex: 1;

    position: relative;

}


#map {

    width: 100%;
    height: 100%;

}


.map-controls {

    position: absolute;

    z-index: 1000;

    top:
        calc(15px + env(safe-area-inset-top));

    right:
        calc(15px + env(safe-area-inset-right));

    display: flex;

    gap: 6px;

}


.map-button {

    border:
        1px solid #3a3e43;

    background:
        rgba(20,22,24,.94);

    color: white;

    padding:
        9px 14px;

    min-height: 42px;

    display: flex;

    align-items: center;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

}


.map-button:hover {

    background: #2a2d31;

}


/* =========================================================
   POPUP
   ========================================================= */

.popup {

    color: #222;

    min-width: 200px;

    max-width: 74vw;

}


.popup-title {

    font-weight: 700;

    font-size: 15px;

    margin-bottom: 8px;

}


.popup-row {

    font-size: 11px;

    margin:
        5px 0;

}


.popup-row strong {

    font-weight: 700;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:800px) {

    .sidebar {

        width: 330px;

        min-width: 330px;

    }

}


/* Drag handle shown only on the mobile bottom-sheet layout */

.sheet-handle {

    display: none;

    padding: 8px 0 4px;

    text-align: center;

    cursor: pointer;

}


.sheet-handle::after {

    content: "";

    display: inline-block;

    width: 36px;
    height: 4px;

    border-radius: 3px;

    background: #454a51;

}


@media(max-width:600px) {

    html,
    body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
    }

    .app {
        position: relative;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: block;
    }

    .map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
    }

    .sidebar {
        position: fixed;
        width: 100%;
        min-width: 0;
        left: 0;
        bottom: 0;
        z-index: 1200;
        height: min(82dvh, 760px);
        max-height: 82dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: none;
        border-top: 1px solid #303338;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -6px 28px rgba(0,0,0,.45);
        transform: translateY(calc(100% - 82px));
        transition: transform .28s ease;
        will-change: transform;
    }

    .sidebar.expanded {
        transform: translateY(0);
    }

    /* Compact collapsed state: map stays the main screen. */
    .sidebar:not(.expanded) .filters,
    .sidebar:not(.expanded) .stats,
    .sidebar:not(.expanded) .legend,
    .sidebar:not(.expanded) .list,
    .sidebar:not(.expanded) .footer {
        display: none;
    }

    .sheet-handle {
        display: block;
        flex: 0 0 22px;
        padding: 8px 0 4px;
        text-align: center;
        cursor: grab;
        touch-action: none;
    }

    .sheet-handle::after {
        content: "";
        display: inline-block;
        width: 42px;
        height: 4px;
        border-radius: 999px;
        background: #555b63;
    }

    .header {
        flex: 0 0 60px;
        height: 60px;
        min-height: 60px;
        padding: 0 14px;
        cursor: pointer;
        user-select: none;
    }

    .logo {
        gap: 9px;
        min-width: 0;
    }

    .logo-icon {
        width: 34px;
        height: 34px;
        font-size: 17px;
    }

    .logo-title {
        font-size: 14px;
        white-space: nowrap;
    }

    .logo-sub {
        font-size: 9px;
        white-space: nowrap;
    }

    .filters {
        flex: 0 0 auto;
        padding: 10px 12px;
    }

    .search {
        min-height: 44px;
        margin-bottom: 8px;
    }

    .filter-row {
        gap: 8px;
    }

    select {
        min-width: 0;
        min-height: 44px;
        padding: 8px;
    }

    .stats {
        flex: 0 0 auto;
        padding: 8px 12px;
    }

    .stat {
        padding: 8px;
    }

    .stat-number {
        font-size: 17px;
    }

    .legend {
        flex: 0 0 auto;
        max-height: 68px;
        overflow-y: auto;
        padding-bottom: 8px;
    }

    .list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
    }

    .footer {
        flex: 0 0 auto;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }

    .incident {
        padding: 14px 15px;
        min-height: 78px;
    }

    .incident-top {
        align-items: flex-start;
    }

    .incident-type {
        font-size: 14px;
    }

    .incident-location {
        font-size: 12px;
    }

    .incident-meta {
        font-size: 10px;
    }

    .map-controls {
        top: calc(10px + env(safe-area-inset-top));
        right: calc(10px + env(safe-area-inset-right));
        left: auto;
        gap: 6px;
    }

    .map-button {
        min-height: 44px;
        padding: 9px 11px;
        font-size: 12px;
        border-radius: 9px;
    }

    .leaflet-control-zoom {
        margin-top: calc(62px + env(safe-area-inset-top)) !important;
    }

    .popup {
        min-width: 0;
        max-width: calc(100vw - 48px);
    }
}

@media(max-width:390px) {
    .live {
        display: none;
    }

    .logo-sub {
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .map-button {
        padding: 9px 10px;
    }
}

@media(min-width:601px) and (max-width:800px) {
    .sidebar {
        width: 330px;
        min-width: 330px;
    }
}

</style>

</head>


<body>

</div>

     MAP
     ====================================================== -->

<div class="map">

    <div class="map-controls">

        <button
            class="map-button"

            Fit Calls

        <button
            class="map-button"
            onclick="loadIncidents()">
            ↻ Refresh

    </div>


    <div id="map"></div>

</div>


</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js">
</script>


<script>

/* ============================================================
   CAD DATA ENGINE
   ------------------------------------------------------------
   This replaces server.js entirely. It runs in the browser:
   it tries to fetch the real CHP + VCFD feeds directly with
   fetch(), and if a feed can't be reached (most likely because
   media.chp.ca.gov / firefeeds.venturacounty.gov don't send
   CORS headers, so the browser blocks the response) it falls
   back to a self-updating in-memory simulation with the same
   shape as the real data, so the dashboard always has
   something live-feeling to show. No Node.js, no build step,
   no server — just open this file or serve it as a static
   page.
   ============================================================ */

const CHP_URL = "https://media.chp.ca.gov/sa_xml/sa.xml";
const VCFD_URL = "https://firefeeds.venturacounty.gov/api/incidents";

const FETCH_TIMEOUT_MS = 10000;

// How often the demo simulation advances on its own, independent of any
// UI polling. Incidents progress through their lifecycle and new ones
// spawn even between refreshes, the same way a real CAD feed changes.
const SIM_TICK_MS = 8000;

// =====================================================
// HELPER: fetch with timeout
// =====================================================

async function fetchWithTimeout(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

    try {
        // NOTE: custom headers like User-Agent can't be set from browser
        // JS (they're on the forbidden header list), so we just fetch
        // plainly here. mode:"cors" makes the CORS failure explicit
        // rather than silently returning an opaque response.
        return await fetch(url, { signal: controller.signal, mode: "cors" });
    } finally {
        clearTimeout(timer);
    }
}

async function fetchSource(name, url, parseAs, demoFallback) {
    let response;

    try {
        response = await fetchWithTimeout(url);
    } catch (err) {
        const message = err.name === "AbortError" ? "Request timed out" : err.message;
        console.warn(`${name} ERROR (fetch): ${message} - serving demo snapshot instead`);
        return { data: demoFallback(), error: message, demo: true };
    }

    if (!response.ok) {
        console.warn(`${name} returned HTTP ${response.status} - serving demo snapshot instead`);
        return { data: demoFallback(), error: `HTTP ${response.status}`, demo: true };
    }

    try {
        const data = parseAs === "json" ? await response.json() : await response.text();
        console.log(`${name} loaded successfully`);
        return { data, error: null, demo: false };
    } catch (err) {
        console.warn(`${name} returned invalid ${parseAs.toUpperCase()}: ${err.message} - serving demo snapshot instead`);
        return { data: demoFallback(), error: err.message, demo: true };
    }
}

// =====================================================
// DEMO SIMULATION ENGINE
//
// Keeps live in-memory incident objects that age forward on a timer
// (SIM_TICK_MS) and walk through the same status vocabulary a real
// CHP/VCFD CAD operator would type: units go Enrt -> Onscene -> Code 4 /
// Closed, detail lines get appended with real timestamps, and new
// incidents spawn while stale ones roll off.
// =====================================================

// All 24 CHP communications/dispatch centers statewide (source:
// cad.chp.ca.gov CHP Area Offices by Dispatch Center listing), so the
// simulation spawns calls from the whole state, not just a few centers.
const CHP_CENTERS = {
    HBCC: "Humboldt Dispatch Center",
    RDCC: "Redding Dispatch Center",
    SUCC: "Susanville Dispatch Center",
    YKCC: "Yreka Dispatch Center",
    UKCC: "Ukiah Dispatch Center",
    SACC: "Sacramento Communications Center",
    TKCC: "Truckee Dispatch Center",
    CHCC: "Chico Dispatch Center",
    SKCC: "Stockton Dispatch Center",
    GGCC: "Golden Gate Communications Center",
    BKCC: "Bakersfield Dispatch Center",
    FRCC: "Fresno Dispatch Center",
    MRCC: "Merced Dispatch Center",
    LACC: "Los Angeles Communications Center",
    BCCC: "Border Communications Center",
    ECCC: "El Centro Dispatch Center",
    INCC: "Indio Dispatch Center",
    OCCC: "Orange County Communications Center",
    MOCC: "Monterey Dispatch Center",
    SLCC: "San Luis Obispo Dispatch Center",
    VTCC: "Ventura Dispatch Center",
    ICCC: "Inland Communications Center",
    BPCC: "Bishop Dispatch Center",
    BSCC: "Barstow Dispatch Center",
};

const CHP_TEMPLATES = [
    {
        type: "Trfc Collision-1141 Enrt", weight: 3, minPhases: 4, maxPhases: 6,
        phaseUnits: ["1141 Enrt", "1141 Enrt", "Onscene", "Code 4", "Closed"],
        detailPool: ["1141 Enrt", "Amr Enrt", "Trfc Adv Rqst", "2 Veh Invl", "1183 Enrt", "Rp Statement Only", "Code 4 At Scene"],
    },
    {
        type: "Trfc Collision-Unkn Inj", weight: 2, minPhases: 4, maxPhases: 6,
        phaseUnits: ["Enrt", "1141 Enrt", "Onscene", "Amr Enrt", "Closed"],
        detailPool: ["Amr Enrt", "1183 Enrt", "1141 Enrt", "Trfc Adv Rqst", "Unkn Inj Reported", "Code 4 At Scene"],
    },
    {
        type: "Trfc Collision-No Inj", weight: 3, minPhases: 3, maxPhases: 4,
        phaseUnits: ["Enrt", "Onscene", "Closed"],
        detailPool: ["Info Only", "Rp Statement Only", "Both Veh Moved To Shldr", "Code 4 At Scene"],
    },
    {
        type: "SIG Alert", weight: 1, minPhases: 4, maxPhases: 6,
        phaseUnits: ["Enrt", "Onscene", "Sig Alert Issued", "Rt Lns Reopened", "Closed"],
        detailPool: ["Sig Alert Issued", "2 Rt Lns Blkd", "Caltrans Enrt", "Rt Lns Reopened", "Code 4 At Scene"],
    },
    {
        type: "Traffic Hazard", weight: 3, minPhases: 3, maxPhases: 5,
        phaseUnits: ["Enrt", "Onscene", "Closed"],
        detailPool: ["Debris In Rdwy", "Requesting Caltrans", "1141 Enrt Non Injury", "Hazard Removed"],
    },
    {
        type: "Vehicle Fire", weight: 1, minPhases: 4, maxPhases: 5,
        phaseUnits: ["Enrt", "Onscene", "Fd Enrt", "Closed"],
        detailPool: ["Vcfd Enrt", "Veh Fully Involved", "Fire Out", "1 Rt Lane Blkd"],
    },
    {
        type: "Hit and Run No Injuries", weight: 1, minPhases: 3, maxPhases: 4,
        phaseUnits: ["Enrt", "Onscene", "Closed"],

function pickWeighted(templates) {
    const total = templates.reduce((sum, t) => sum + t.weight, 0);
    let roll = Math.random() * total;
    for (const t of templates) {
        roll -= t.weight;
        if (roll <= 0) return t;
    }
    return templates[templates.length - 1];
}

function toChpLatLon(lat, lon) {
    return `${Math.round(lat * 1e6)}:${Math.round(Math.abs(lon) * 1e6)}`;
}

function fmtChpTime(ms) {
    const d = new Date(ms);
    const pad = (n) => String(n).padStart(2, "0");
    const hours24 = d.getHours();
    const hours12 = ((hours24 + 11) % 12) + 1;
    const ampm = hours24 >= 12 ? "PM" : "AM";
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return `${months[d.getMonth()]} ${d.getDate()} ${d.getFullYear()} ${hours12}:${pad(d.getMinutes())}${ampm}`;
}

const sim = {
    chpIncidents: new Map(),
    vcfdIncidents: new Map(),
    nextChpId: 4000,
    nextVcfdId: 20000,
};

function spawnChpIncident(now) {
    const template = pickWeighted(CHP_TEMPLATES);
    const spot = CHP_LOCATIONS[Math.floor(Math.random() * CHP_LOCATIONS.length)];
    const phaseCount = template.minPhases + Math.floor(Math.random() * (template.maxPhases - template.minPhases + 1));
    const id = `${spot.center}-${sim.nextChpId++}`;

    const incident = {
        id,
        center: spot.center,
        type: template.type,
        loc: spot.loc,
        desc: spot.desc,
        area: spot.area,
        lat: spot.lat + (Math.random() - 0.5) * 0.004,
        lon: spot.lon + (Math.random() - 0.5) * 0.004,
        createdAt: now,
        lastUpdate: now,
        phase: 0,
        phaseCount,
        status: template.phaseUnits[0] || "Enrt",
        closed: false,
        closedAt: null,
        details: [{ time: fmtChpTime(now), text: template.detailPool[0] || template.phaseUnits[0] }],
        template,
    };

    sim.chpIncidents.set(id, incident);
}

function spawnVcfdIncident(now) {
    const template = pickWeighted(VCFD_TEMPLATES);
    const spot = VCFD_LOCATIONS[Math.floor(Math.random() * VCFD_LOCATIONS.length)];
    const id = String(sim.nextVcfdId++);

    const incident = {
        id,
        type: template.type,
        block: spot.block,
        address: spot.address,
        city: spot.city,
        lat: spot.lat + (Math.random() - 0.5) * 0.004,
        lon: spot.lon + (Math.random() - 0.5) * 0.004,
        createdAt: now,
        lastUpdate: now,
        phase: 0,
        status: template.phases[0],
        units: template.units,
        closed: false,
        closedAt: null,
        template,
    };

    sim.vcfdIncidents.set(id, incident);
}

function tickSimulation() {
    const now = Date.now();

    for (const incident of sim.chpIncidents.values()) {
        if (incident.closed) continue;
        if (Math.random() < 0.55) {
            incident.phase += 1;
            incident.lastUpdate = now;
            const units = incident.template.phaseUnits;
            const nextStatus = units[Math.min(incident.phase, units.length - 1)];
            incident.status = nextStatus;

            const detailChoice = incident.template.detailPool[
                Math.floor(Math.random() * incident.template.detailPool.length)
            ];
            incident.details.unshift({ time: fmtChpTime(now), text: detailChoice });
            if (incident.details.length > 6) incident.details.length = 6;

            if (incident.phase >= incident.phaseCount || nextStatus === "Closed") {
                incident.closed = true;
                incident.closedAt = now;
                incident.status = "Closed";
            }
        }
    }

    for (const incident of sim.vcfdIncidents.values()) {
        if (incident.closed) continue;
        if (Math.random() < 0.5) {
            incident.phase += 1;
            incident.lastUpdate = now;
            const phases = incident.template.phases;
            incident.status = phases[Math.min(incident.phase, phases.length - 1)];
            if (incident.phase >= phases.length - 1) {
                incident.closed = true;
                incident.closedAt = now;
            }
        }
    }

    for (const [id, incident] of sim.chpIncidents) {
        if (incident.closed && now - incident.closedAt > 6 * 60000) sim.chpIncidents.delete(id);
    }
    for (const [id, incident] of sim.vcfdIncidents) {
        if (incident.closed && now - incident.closedAt > 6 * 60000) sim.vcfdIncidents.delete(id);
    }

    const activeChp = [...sim.chpIncidents.values()].filter((i) => !i.closed).length;
    if (activeChp < 60 && Math.random() < 0.65) spawnChpIncident(now);

    const activeVcfd = [...sim.vcfdIncidents.values()].filter((i) => !i.closed).length;
    if (activeVcfd < 10 && Math.random() < 0.4) spawnVcfdIncident(now);
}

function seedSimulation() {
    const now = Date.now();
    for (let i = 0; i < 40; i++) spawnChpIncident(now);
    for (let i = 0; i < 6; i++) spawnVcfdIncident(now);
    for (let i = 0; i < 10; i++) tickSimulation();
}

function renderDemoCHPXml() {
    const byCenter = {};
    for (const incident of sim.chpIncidents.values()) {
        if (!byCenter[incident.center]) byCenter[incident.center] = [];
        byCenter[incident.center].push(incident);
    }

    const dispatchBlocks = Object.entries(byCenter).map(([centerId, incidents]) => {
        const logs = incidents.map((inc) => {
            const details = inc.details
                .map((d) => `<details><DetailTime>${d.time}</DetailTime><IncidentDetail>"${d.text}"</IncidentDetail></details>`)
                .join("");
            return `<Log ID="${inc.id}">
      <LogTime>${fmtChpTime(inc.createdAt)}</LogTime>
      <LogType>${inc.type}</LogType>
      <Location>${inc.loc}</Location>
      <LocationDesc>${inc.desc}</LocationDesc>
      <Area>${inc.area}</Area>
      <LATLON>${toChpLatLon(inc.lat, inc.lon)}</LATLON>
      <LogDetails>${details}</LogDetails>
      <units><UnitTime>${fmtChpTime(inc.lastUpdate)}</UnitTime><UnitDetail>${inc.status}</UnitDetail></units>
    </Log>`;
        }).join("\n");

        return `  <Dispatch ID="${centerId}">
    <Center>${CHP_CENTERS[centerId] || centerId}</Center>
    ${logs}
  </Dispatch>`;
    }).join("\n");

    return `<?xml version="1.0" encoding="UTF-8"?>
<CenterList>
${dispatchBlocks}
</CenterList>`;
}

function renderDemoVCFDJson() {
    return [...sim.vcfdIncidents.values()].map((inc) => ({
        incidentNumber: `VC-${new Date(inc.createdAt).getFullYear()}-${inc.id}`,
        incidentType: inc.type,
        // ISO string so Date.parse() works reliably in every browser
        responseDate: new Date(inc.createdAt).toISOString(),
        block: inc.block,
        address: inc.address,
        city: inc.city,
        latitude: inc.lat,
        longitude: inc.lon,
        status: inc.status,
        units: inc.units,
    }));
}

// =====================================================
// CHP XML PARSING (real feed and demo feed share this schema)
// =====================================================

function parseChpXml(xmlText) {
    const result = [];

    try {
        const doc = new DOMParser().parseFromString(xmlText, "text/xml");
        if (doc.querySelector("parsererror")) {
            console.warn("CHP XML failed to parse");
            return result;
        }

        for (const dispatch of doc.getElementsByTagName("Dispatch")) {
            const centerEl = dispatch.getElementsByTagName("Center")[0];
            const center = centerEl ? centerEl.textContent.trim() : "";

            for (const log of dispatch.getElementsByTagName("Log")) {
                const get = (tag) => {
                    const el = log.getElementsByTagName(tag)[0];
                    return el ? el.textContent.trim() : "";
                };

                const id = log.getAttribute("ID") || "";
                const latlon = get("LATLON");

                let lat = null;
                let lon = null;
                if (latlon.includes(":")) {
                    const [rawLat, rawLon] = latlon.split(":");
                    const latNum = parseFloat(rawLat);
                    const lonNum = parseFloat(rawLon);
                    if (Number.isFinite(latNum) && Number.isFinite(lonNum)) {
                        lat = latNum / 1e6;
                        lon = -Math.abs(lonNum) / 1e6;
                    }
                }

                const details = [];
                for (const d of log.getElementsByTagName("details")) {
                    const dt = d.getElementsByTagName("DetailTime")[0];
                    const dd = d.getElementsByTagName("IncidentDetail")[0];
                    details.push({
                        time: dt ? dt.textContent.trim() : "",
                        text: dd ? dd.textContent.trim().replace(/^"|"$/g, "") : "",
                    });
                }

                const unitEls = log.getElementsByTagName("units");
                let status = "";
                if (unitEls.length) {
                    const lastUnit = unitEls[unitEls.length - 1];
                    const ud = lastUnit.getElementsByTagName("UnitDetail")[0];
                    status = ud ? ud.textContent.trim() : "";
                }

                result.push({
                    id,
                    center,
                    logTime: get("LogTime"),
                    logType: get("LogType"),
                    location: get("Location"),
                    locationDesc: get("LocationDesc"),
                    area: get("Area"),
                    lat,
                    lon,
                    details,
                    status,
                });
            }
        }
    } catch (err) {
        console.error("Failed to parse CHP XML:", err);
    }

    return result;
}

// =====================================================
// CATEGORY CLASSIFICATION (heuristic, based on incident type text)
// =====================================================

function classify(rawType) {
    const t = (rawType || "").toLowerCase();
    if (t.includes("animal")) return "Other";
    if (t.includes("fire")) return "Fire";
    if (t.includes("medical") || t.includes(" aid")) return "Medical";
    if (t.includes("hazmat") || t.includes("spill")) return "Hazmat";
    if (
        t.includes("trfc") ||
        t.includes("traffic") ||
        t.includes("collision") ||
        t.includes("sig alert") ||
        t.includes("hit and run") ||
        t.includes("1182")
    ) return "Traffic";
    if (t.includes("rescue") || t.includes("public assist")) return "Rescue";
    return "Other";
}

// =====================================================
// NORMALIZE INTO THE SHAPE THE UI RENDERS
// =====================================================

function normalizeChp(item) {
    return {
        id: "CHP-" + item.id,
        source: "CHP",
        type: item.logType || "Unknown",
        category: classify(item.logType),
        location: item.location + (item.locationDesc ? ` (${item.locationDesc})` : ""),
        city: item.area,
        latitude: item.lat,
        longitude: item.lon,
        status: item.status || "Unknown",
        time: item.logTime,
        incidentNumber: item.id,
        units: item.status ? [item.status] : [],
        comment: item.details && item.details.length ? item.details[0].text : "",
    };
}

function normalizeVcfd(item) {
    return {
        id: "VCFD-" + (item.incidentNumber || item.id || Math.random().toString(36).slice(2)),
        source: "VCFD",
        type: item.incidentType || item.type || "Unknown",
        category: classify(item.incidentType || item.type),
        location: [item.block, item.address].filter(Boolean).join(" "),
        city: item.city,
        latitude: Number(item.latitude),
        longitude: Number(item.longitude),
        status: item.status || "Unknown",
        time: item.responseDate,
        incidentNumber: item.incidentNumber,
        units: item.units ? String(item.units).split(",").map((s) => s.trim()).filter(Boolean) : [],
        comment: "",
    };
}

// =====================================================
// PUBLIC ENTRY POINT — this is what the UI calls instead of
// fetch("/api/incidents")
// =====================================================

async function getIncidents() {
    const [chpResult, vcfdResult] = await Promise.all([
        fetchSource("CHP", CHP_URL, "text", renderDemoCHPXml),
        fetchSource("VCFD", VCFD_URL, "json", renderDemoVCFDJson),
    ]);

    const chpIncidents = parseChpXml(chpResult.data).map(normalizeChp);
    const vcfdRaw = Array.isArray(vcfdResult.data) ? vcfdResult.data : [];
    const vcfdIncidents = vcfdRaw.map(normalizeVcfd);

    return {
        incidents: [...vcfdIncidents, ...chpIncidents],
        status: {
            vcfd: true, // data is always available (real or demo fallback)
            chp: true,
            vcfdMethod: vcfdResult.demo ? "DEMO" : "LIVE",
            chpMethod: chpResult.demo ? "DEMO" : "LIVE",
        },
        updated: Date.now(),
    };
}

</script>


<script>


// ==========================================================
// MOBILE BOTTOM SHEET
//
// On narrow screens the sidebar becomes a bottom sheet (see the
// max-width:600px CSS) that opens collapsed - just the header and
// stats peeking over the map - so the map is the primary view.
// Tapping the drag handle or header expands it to browse the full
// incident list, and tapping again (or picking an incident) collapses
// it back down so the map is visible again.
// ==========================================================

const sidebarEl = document.getElementById("sidebar");
const sheetHandleEl = document.getElementById("sheetHandle");
const sheetHeaderEl = document.getElementById("sheetHeader");

function isMobileLayout() {
    return window.matchMedia("(max-width: 600px)").matches;
}

function toggleSheet(forceState) {
    if (!isMobileLayout()) return;

    const shouldExpand =
        typeof forceState === "boolean"
            ? forceState
            : !sidebarEl.classList.contains("expanded");

    sidebarEl.classList.toggle("expanded", shouldExpand);

    // Leaflet measures its container when it initializes. Give the sheet
    // animation a moment to finish, then force a map resize.
    setTimeout(() => map.invalidateSize({ animate: false }), 320);
}

sheetHeaderEl.addEventListener("click", (event) => {
    if (event.target.closest("input, select, button")) return;
    toggleSheet();
});

sheetHandleEl.addEventListener("click", () => toggleSheet());

let dragStartY = null;
let dragStartExpanded = false;

sheetHandleEl.addEventListener("pointerdown", (event) => {
    if (!isMobileLayout()) return;
    dragStartY = event.clientY;
    dragStartExpanded = sidebarEl.classList.contains("expanded");
    sheetHandleEl.setPointerCapture?.(event.pointerId);
});

sheetHandleEl.addEventListener("pointerup", (event) => {
    if (!isMobileLayout() || dragStartY === null) return;

    const distance = event.clientY - dragStartY;

    if (Math.abs(distance) > 28) {
        toggleSheet(distance < 0);
    } else {
        toggleSheet(!dragStartExpanded);
    }

    dragStartY = null;
});

sheetHandleEl.addEventListener("pointercancel", () => {
    dragStartY = null;
});

window.addEventListener("resize", () => {
    if (!isMobileLayout()) {
        sidebarEl.classList.remove("expanded");
    }
    setTimeout(() => map.invalidateSize({ animate: false }), 100);
});

//
// Markers/badges are colored by incident category (Medical,
// Fire, Traffic, Rescue, Hazmat, Other) rather than just by
// agency - this is far more useful at a glance since both
// VCFD and CHP report several of the same categories.
// ==========================================================

const CATEGORY_COLORS = {

    Medical:
        "#2ecc71",

    Fire:
        "#e74c3c",

    Traffic:
        "#3498db",

    Rescue:
        "#9b59b6",

    Hazmat:
        "#f1c40f",

    Other:
        "#8899a6"

};


function categoryColor(call) {

    return (
        CATEGORY_COLORS[call.category] ||
        CATEGORY_COLORS.Other
    );

}


function buildLegend() {

    const legend =
        document.getElementById(
            "legend"
        );


    legend.innerHTML =
        Object.entries(CATEGORY_COLORS)
            .map(([label, color]) => `

                <div class="legend-item">

                    <span
                        class="legend-dot"
                        style="background:${color}">
                    </span>

                    ${label}

                </div>

            `)
            .join("");

}


// ==========================================================
// MAP
// ==========================================================

const map =
    L.map("map")
     .setView(
        [37.0, -119.5],
        6
     );


// Satellite imagery base layer (Esri World Imagery)
L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {

        maxZoom: 19,

        attribution:
            "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"

    }
).addTo(map);


// Thin labels + roads overlay on top of the imagery so street names,
// highway numbers, and city labels stay legible over the satellite base.
L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {

        maxZoom: 19

    }
).addTo(map);


// Marker cluster group

const markerGroup =
    L.markerClusterGroup({

        showCoverageOnHover:
            false,

        maxClusterRadius:
            45

    });


map.addLayer(
    markerGroup
);


let incidents = [];

let markers = new Map();


// ==========================================================
// ICONS
//
// Fill color = incident category. Ring style tells you the
// agency at a glance: solid white ring = VCFD, dashed ring =
// CHP (matches the "on-freeway" nature of most CHP calls).
// ==========================================================

function iconFor(call) {

    const color =
        categoryColor(call);


    const border =
        call.source === "VCFD"
            ? "3px solid white"
            : "3px dashed white";


    return L.divIcon({

        className: "",

        html: `

            <div style="
                width:20px;
                height:20px;
                border-radius:50%;
                background:${color};
                border:${border};
                box-shadow:0 1px 8px #000;
            "></div>

        `,

        iconSize:
            [20,20],

        iconAnchor:
            [10,10]

    });

}


// ==========================================================
// TIME FORMATTING
// ==========================================================

function parseIncidentTime(value) {

    if (!value) {
        return NaN;
    }


    // CHP times look like "Aug 20 2026 1:42PM" - missing the
    // space before AM/PM breaks JS's date parser.

    const normalized =
        String(value)
            .replace(
                /(\d)(AM|PM)$/i,
                "$1 $2"
            );


    return Date.parse(
        normalized
    );

}


function timeAgo(value) {

    const ts =
        parseIncidentTime(
            value
        );


    if (!Number.isFinite(ts)) {
        return "";
    }


    const diffMs =
        Date.now() - ts;

    const diffMin =
        Math.round(
            diffMs / 60000
        );


    if (diffMin < 1) {
        return "just now";
    }

    if (diffMin < 60) {
        return `${diffMin}m ago`;
    }


    const diffHr =
        Math.round(
            diffMin / 60
        );


    if (diffHr < 24) {
        return `${diffHr}h ago`;
    }


    const diffDay =
        Math.round(
            diffHr / 24
        );


    return `${diffDay}d ago`;

}


// ==========================================================
// ESCAPE HTML
// ==========================================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            c => ({

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            })[c]
        );

}


// ==========================================================
// FILTER
// ==========================================================

function getFiltered() {

    const agency =
        document.getElementById(
            "agency"
        ).value;


    const category =
        document.getElementById(
            "category"
        ).value;


    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    return incidents.filter(call => {

        if (
            agency !== "ALL" &&
            call.source !== agency
        ) {
            return false;
        }


        if (
            category !== "ALL" &&
            call.category !== category
        ) {
            return false;
        }


        if (search) {

            const text =
                [

                    call.type,
                    call.location,
                    call.city,
                    call.incidentNumber,
                    call.comment,
                    ...(call.units || [])

                ]
                .join(" ")
                .toLowerCase();


            if (!text.includes(search)) {
                return false;
            }

        }


        return true;

    });

}


// ==========================================================
// DRAW MAP
// ==========================================================

function drawMap() {

    markerGroup.clearLayers();

    markers.clear();


    const calls =
        getFiltered();


    calls.forEach(call => {

        if (
            !Number.isFinite(
                call.latitude
            ) ||
            !Number.isFinite(
                call.longitude
            )
        ) {

            return;

        }


        const marker =
            L.marker(

                [
                    call.latitude,
                    call.longitude
                ],

                {
                    icon:
                        iconFor(call)
                }

            );


        marker.bindPopup(`

            <div class="popup">

                <div class="popup-title">

                    ${escapeHTML(
                        call.type
                    )}

                </div>


                <div class="popup-row">
                    <strong>Agency:</strong>
                    ${escapeHTML(
                        call.source
                    )}
                </div>


                <div class="popup-row">
                    <strong>Incident:</strong>
                    ${escapeHTML(
                        call.incidentNumber
                    )}
                </div>


                <div class="popup-row">
                    <strong>Location:</strong>
                    ${escapeHTML(
                        call.location
                    )}
                </div>


                <div class="popup-row">
                    <strong>Area:</strong>
                    ${escapeHTML(
                        call.city
                    )}
                </div>


                <div class="popup-row">
                    <strong>Status:</strong>
                    ${escapeHTML(
                        call.status
                    )}
                </div>


                <div class="popup-row">
                    <strong>Reported:</strong>
                    ${escapeHTML(
                        call.time
                    )}
                    ${
                        timeAgo(call.time)
                        ?
                        ` (${escapeHTML(timeAgo(call.time))})`
                        :
                        ""
                    }
                </div>


                ${
                    call.units?.length
                    ?
                    `
                    <div class="popup-row">
                        <strong>Units:</strong>
                        ${escapeHTML(
                            call.units.join(", ")
                        )}
                    </div>
                    `
                    :
                    ""
                }


                ${
                    call.comment
                    ?
                    `
                    <div class="popup-row">
                        <strong>Details:</strong>
                        ${escapeHTML(
                            call.comment
                        )}
                    </div>
                    `
                    :
                    ""
                }

            </div>

        `);


        marker.on(
            "click",
            () => {

                highlightIncident(
                    call.id
                );

            }
        );


        markerGroup.addLayer(
            marker
        );


        markers.set(
            call.id,
            marker
        );

    });

}


// ==========================================================
// INCIDENT LIST
// ==========================================================

function drawList() {

    const list =
        document.getElementById(
            "incidentList"
        );


    const calls =
        getFiltered();


    list.innerHTML = "";


    if (!calls.length) {

        list.innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                color:#777;
                font-size:12px;
            ">

                No incidents found.

            </div>

        `;

        return;

    }


    calls.forEach(call => {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "incident";


        element.dataset.id =
            call.id;


        const ago =
            timeAgo(call.time);


        element.innerHTML = `

            <div class="incident-top">

                <span class="
                    badge
                    ${
                        call.source === "VCFD"
                            ? "badge-vcfd"
                            : "badge-chp"
                    }
                ">

                    ${escapeHTML(
                        call.source
                    )}

                </span>


                <span style="
                    color:#777;
                    font-size:9px;
                ">

                    ${escapeHTML(
                        ago || call.time
                    )}

                </span>

            </div>


            <div class="incident-type">

                <span
                    class="type-dot"
                    style="background:${categoryColor(call)}">
                </span>

                ${escapeHTML(
                    call.type
                )}

            </div>


            <div class="incident-location">

                ${escapeHTML(
                    call.location
                )}

            </div>


            <div class="incident-meta">

                <span>

                    ${escapeHTML(
                        call.city
                    )}

                </span>


                <span>

                    ${escapeHTML(
                        call.incidentNumber
                    )}

                </span>

            </div>

        `;


        element.onclick =
            () => {

                focusIncident(
                    call
                );

            };


        list.appendChild(
            element
        );

    });

}


// ==========================================================
// FOCUS INCIDENT
// ==========================================================

function focusIncident(call) {

    // On mobile, collapse the sheet so the map (and the marker/popup
    // we're about to open) is actually visible instead of staying
    // hidden behind the expanded list.
    toggleSheet(false);


    if (
        !Number.isFinite(
            call.latitude
        ) ||
        !Number.isFinite(
            call.longitude
        )
    ) {

        highlightIncident(
            call.id
        );

        return;

    }


    map.setView(
        [
            call.latitude,
            call.longitude
        ],
        15
    );


    const marker =
        markers.get(
            call.id
        );


    if (marker) {

        markerGroup.zoomToShowLayer(
            marker,
            () => {

                marker.openPopup();

            }
        );

    }


    highlightIncident(
        call.id
    );

}


// ==========================================================
// HIGHLIGHT LIST ITEM
// ==========================================================

function highlightIncident(id) {

    document
        .querySelectorAll(
            ".incident"
        )
        .forEach(element => {

            element.classList.toggle(
                "active",
                element.dataset.id === id
            );

        });

}


// ==========================================================
// FIT ALL
// ==========================================================

function fitAll() {

    const layers =
        markerGroup.getLayers();


    if (!layers.length) {
        return;
    }


    map.fitBounds(
        markerGroup.getBounds(),
        {
            padding:
                [30,30]
        }
    );

}


// ==========================================================
// STATISTICS
// ==========================================================

function updateStats() {

    const calls =
        getFiltered();


    document.getElementById(
        "total"
    ).textContent =
        calls.length;


    document.getElementById(
        "vcfd"
    ).textContent =
        incidents.filter(
            x => x.source === "VCFD"
        ).length;


    document.getElementById(
        "chp"
    ).textContent =
        incidents.filter(
            x => x.source === "CHP"
        ).length;

}


// ==========================================================
// FEED STATUS
// ==========================================================

function setFeedStatus(
    element,
    dot,
    online,
    text
) {

    document.getElementById(
        element
    ).textContent =
        text;


    const d =
        document.getElementById(
            dot
        );


    d.className =
        "feed-dot " +
        (
            online
                ? "feed-ok"
                : "feed-bad"
        );

}


// ==========================================================
// LOAD DATA
//
// This now calls the in-browser CAD data engine (getIncidents,
// defined above) directly instead of fetching from a Node
// server - there is no server anymore.
// ==========================================================

async function loadIncidents() {

    try {

        const data =
            await getIncidents();


        incidents =
            data.incidents || [];


        drawMap();

        drawList();

        updateStats();


        // --------------------------
        // Feed status
        // --------------------------

        setFeedStatus(
            "vcfdStatus",
            "vcfdDot",
            data.status.vcfdMethod !== "DEMO",
            data.status.vcfdMethod === "DEMO"
                ? "DEMO"
                : "LIVE"
        );


        setFeedStatus(
            "chpStatus",
            "chpDot",
            data.status.chpMethod !== "DEMO",
            data.status.chpMethod === "DEMO"
                ? "DEMO"
                : "LIVE"
        );


        // --------------------------
        // Header
        // --------------------------

        document.getElementById(
            "liveDot"
        ).style.background =
            "#36c275";


        document.getElementById(
            "liveText"
        ).textContent =
            "LIVE";


        // --------------------------
        // Updated
        // --------------------------

        document.getElementById(
            "updated"
        ).textContent =
            "Updated " +
            new Date(
                data.updated
            ).toLocaleTimeString();


    }

    catch(error) {

        console.error(
            "Unable to load incidents:",
            error
        );

        document.getElementById(
            "liveText"
        ).textContent =
            "ERROR";

    }

}


// ==========================================================
// FILTER EVENTS
// ==========================================================

document.getElementById(
    "agency"
).addEventListener(
    "change",
    () => {

        drawMap();
        drawList();
        updateStats();

    }
);


document.getElementById(
    "category"
).addEventListener(
    "change",
    () => {

        drawMap();
        drawList();
        updateStats();

    }
);


document.getElementById(
    "search"
).addEventListener(
    "input",
    () => {

        drawMap();
        drawList();
        updateStats();

    }
);


// ==========================================================
// INITIAL LOAD
// ==========================================================

buildLegend();

loadIncidents();


// ==========================================================
// AUTO REFRESH
// ==========================================================
//
// Refresh incidents every 60s, and re-render the list every
// 15s on its own so the "Xm ago" timestamps stay fresh even
// between fetches.

setInterval(
    loadIncidents,
    60000
);


setInterval(
    drawList,
    15000
);

</script>


</body>

</html>
